name: Validate Supabase catalog client wiring

on:
  push:
    branches:
      - agent/supabase-recommendation-catalog

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/supabase-recommendation-catalog
          fetch-depth: 0

      - name: Patch client catalog source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/what-to-watch-app.tsx")
          text = path.read_text()

          old_catalog = "const catalog: Title[] = ["
          assert text.count(old_catalog) == 1, "Expected exactly one module catalog declaration"
          text = text.replace(old_catalog, "let catalog: Title[] = [", 1)

          toast_anchor = '  const [toast, setToast] = useState("");\n'
          assert text.count(toast_anchor) == 1, "Could not find toast state anchor"
          text = text.replace(
              toast_anchor,
              toast_anchor + '  const [, forceCatalogRender] = useState(0);\n',
              1,
          )

          persistence_anchor = '  useEffect(() => { if (hydrated) localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }, [store, hydrated]);\n'
          assert text.count(persistence_anchor) == 1, "Could not find persistence effect anchor"
          catalog_effect = '''  useEffect(() => {\n    const controller = new AbortController();\n    fetch("/api/catalog/recommendation-titles", { signal: controller.signal })\n      .then(async (response) => {\n        if (!response.ok) throw new Error(`Catalog returned ${response.status}`);\n        return response.json() as Promise<{ source?: string; titleCount?: number; titles?: Title[] }>;\n      })\n      .then((payload) => {\n        if (!Array.isArray(payload.titles) || payload.titleCount !== 100 || payload.titles.length !== 100) {\n          throw new Error("Catalog payload is incomplete");\n        }\n        catalog = payload.titles;\n        forceCatalogRender((value) => value + 1);\n      })\n      .catch((error: unknown) => {\n        if (error instanceof DOMException && error.name === "AbortError") return;\n        // Keep the reviewed demo catalog as a safe fallback if the remote catalog is unavailable.\n      });\n    return () => controller.abort();\n  }, []);\n'''
          text = text.replace(persistence_anchor, catalog_effect + persistence_anchor, 1)

          replacements = {
              'return { label: "Demo availability", provider: included };': 'return { label: "Streaming availability", provider: included };',
              'return { label: "Demo rental option", provider: title.providers[0] };': 'return { label: "Rental option", provider: title.providers[0] };',
              '>All titles</button><button className={filter === "rated"': '>All titles <span>{catalog.length}</span></button><button className={filter === "rated"',
              '<strong>No title in the demo catalog</strong><p>Connect a TMDB key to search the complete movie and TV catalog.</p>': '<strong>No matching title in the catalog</strong><p>Try a different title or clear the current filter.</p>',
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, f"Expected exactly one client copy anchor: {old[:50]}"
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit validated client wiring
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/what-to-watch-app.tsx
          git rm .github/workflows/agent-pr3-catalog-review.yml
          git commit -m "Connect app to Supabase gold catalog"
          git push origin HEAD:agent/supabase-recommendation-catalog
